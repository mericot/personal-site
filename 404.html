<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — the game didn't break</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .four { font: 800 clamp(72px, 20vw, 160px)/0.9 var(--font-display); letter-spacing: -0.06em; margin: 0; }
    .game { border: var(--rule); padding: var(--s-6); display: flex; flex-direction: column; gap: var(--s-4); }
    .hud { display: flex; justify-content: space-between; font: 500 13px var(--font-mono); letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }
    #runner { display: block; width: 100%; height: 160px; cursor: pointer; touch-action: manipulation; }
    .credit { font: 500 12px var(--font-mono); color: var(--muted); }
  </style>
  <script data-goatcounter="https://YOUR_CODE.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
  <main>
    <header class="top">
      <a class="brand" href="/"><span class="wordmark">Samuel</span></a>
      <a class="btn btn-ghost" href="/">← Back home</a>
    </header>

    <section>
      <h1 class="four plate">404</h1>
      <p class="lead plate">That link broke. The game didn't.</p>
    </section>

    <section class="game" aria-label="Dino game">
      <div class="hud"><span id="hint">Tap or press space to jump</span><span>HI <span id="hi">00000</span>&nbsp;&nbsp;<span id="score">00000</span></span></div>
      <canvas id="runner" width="1280" height="320" aria-label="A pixel dinosaur running past cacti. Space or tap to jump."></canvas>
      <p class="credit">A small runner in the spirit of Chromium's offline page · your best score stays in this browser</p>
    </section>

    <section class="signup">
      <p class="foot-title plate">While you're here: the weekly build log.</p>
      <iframe class="embed" src="https://embeds.beehiiv.com/EMBED_ID?slim=true" title="Get the updates" loading="lazy" scrolling="no"></iframe>
    </section>
  </main>
  <script src="/game.js" defer></script>
</body>
</html>
